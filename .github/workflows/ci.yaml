name: CI
on:
  push:
    branches:
      - "**"
jobs:
  build:
    strategy:
      matrix:
        node-version: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: ^12.0.0
          runtime: node@${{matrix.node-version}}
          cache: true
      - name: Test
        run: pnpm ci:test
